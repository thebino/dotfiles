actions:
  - action: command.run
    command: cargo
    args:
      - "install"
      - "--locked"
      - "rustic-rs"
  # local
  - action: file.copy
    from: local_encrypted.asc
    to: "{{ user.config_dir }}/rustic/local_encrypted.asc"
  - action: command.run
    command: gpg
    args:
      - "--output"
      - "{{ user.config_dir }}/rustic/local.toml"
      - "--decrypt"
      - "{{ user.config_dir }}/rustic/local_encrypted.asc"
  # nas
  - action: file.copy
    from: nas_encrypted.asc
    to: "{{ user.config_dir }}/rustic/nas_encrypted.asc"
  - action: command.run
    command: gpg
    args:
      - "--output"
      - "{{ user.config_dir }}/rustic/nas.toml"
      - "--decrypt"
      - "{{ user.config_dir }}/rustic/nas_encrypted.asc"
  # rustic
  - action: file.copy
    from: rustic_encrypted.asc
    to: "{{ user.config_dir }}/rustic/rustic_encrypted.asc"
  - action: command.run
    command: gpg
    args:
      - "--output"
      - "{{ user.config_dir }}/rustic/rustic.toml"
      - "--decrypt"
      - "{{ user.config_dir }}/rustic/rustic_encrypted.asc"
