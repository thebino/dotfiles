depends:
  - apps.gnupg
actions:
  - action: command.run
    command: cargo
    args:
      - "install"
      - "--locked"
      - "rustic-rs"
  # local
  - action: file.copy
    from: local_encrypted.asc
    to: "{{ user.config_dir }}/rustic/local.toml"
    chmod: 600
    process_with: [gpg, --quiet, --decrypt]
    # nas
  - action: file.copy
    from: nas_encrypted.asc
    to: "{{ user.config_dir }}/rustic/nas.toml"
    chmod: 600
    process_with: [gpg, --quiet, --decrypt]
  # rustic
  - action: file.copy
    from: rustic_encrypted.asc
    to: "{{ user.config_dir }}/rustic/rustic.toml"
    chmod: 600
    process_with: [gpg, --quiet, --decrypt]
