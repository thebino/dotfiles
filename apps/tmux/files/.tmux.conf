# --- GENERAL SETTINGS ---
# Use vim-style keys in copy mode
setw -g mode-keys vi

# Start windows and panes at index 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows (e.g. on window close)
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Shorter escape time for vim responsiveness
set -s escape-time 10

# Improve terminal colors (but support systems like ssh by not using tmux-256color) 
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# force fish as default
set -g default-shell "/opt/homebrew/bin/fish"
set -g default-command "/opt/homebrew/bin/fish -l"

# --- STATUS BAR ---
# Refresh interval
set -g status-interval 10
set -g status-justify left
set -g status-bg "#1a1b26"
set -g status-fg "#565f89"


# Left: session chip (blue, turns red while prefix is held) + window:pane
set -g status-left-length 140
set -g status-left "\
#[fg=#1a1b26,bg=#7aa2f7,bold]#{?client_prefix,#[bg=#f7768e],} ❐ #S \
#[fg=#a9b1d6,bg=#292e42] #I:#P \
#[fg=#e0af68,bg=#1a1b26]#{?window_zoomed_flag, 🔍 ,}"

# Active window = green chip — same green as the pane border, so "green = focused"
setw -g window-status-current-format "#[fg=#1a1b26,bg=#9ece6a,bold] #I:#W "
setw -g window-status-format        "#[fg=#565f89,bg=#1a1b26] #I:#W "
setw -g window-status-separator     "#[fg=#292e42]│"

# Right: uptime · date · time
set -g status-right-length 140
set -g status-right "\
#[fg=#7dcfff,bg=#292e42] #(uptime | rev | cut -d':' -f1 | rev | sed s/,//g) \
#[fg=#a9b1d6,bg=#292e42] %a %b %d \
#[fg=#1a1b26,bg=#7aa2f7,bold]  %H:%M "

# Borders — green active matches the active-window chip
set -g pane-active-border-style "fg=#9ece6a"
set -g pane-border-style        "fg=#414868"

# Messages & activity
set -g message-style              "bg=#292e42,fg=#7dcfff"
setw -g window-status-activity-style "bg=#292e42,fg=#a9b1d6"



# Window list style
setw -g window-status-current-format "#[fg=colour117,bg=colour234] #I:#W #[default]"
setw -g window-status-format " #I:#W "

# --- SPLITS & NAVIGATION ---
# Easier split shortcuts
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Easier pane navigation (vim-like)
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R

# Resize panes with Shift + Arrow
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5


# --- QUALITY OF LIFE ---
# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Allow renaming windows automatically
set -g allow-rename on

# Set history limit
set -g history-limit 500000

# Focus events
set -g focus-events on


run-shell ~/.local/share/tmux/plugins/tmux-fzf/main.tmux        # prefix + F

set -g @sessionx-zoxide-mode 'on'
run-shell ~/.local/share/tmux/plugins/tmux-sessionx/sessionx.tmux  # prefix + O

# Save/restore — resurrect MUST be sourced before continuum
set -g @resurrect-capture-pane-contents 'on'
run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux

# continuum should be the LAST plugin sourced
set -g @continuum-restore 'on'        # auto-restore on server start
set -g @continuum-save-interval '15'
run-shell ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux
