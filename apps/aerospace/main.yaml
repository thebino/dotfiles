actions:
  - action: package.repository
    provider: homebrew
    name: nikitabobko/tap

  - action: package.install
    list:
      - aerospace

  - action: file.copy
    from: aerospace.toml
    to: "{{ user.home_dir }}/.config/aerospace/aerospace.toml"
    chmod: "644"

  # mission control workaround
  - action: macos.default
    domain: com.apple.dock
    key: expose-group-apps
    kind: bool
    value: "true"
  - action: command.run
    command: killall 
    args:
      - "Dock"

  # Disable "Displays have separate Spaces"
  - action: macos.default
    domain: com.apple.spaces
    key: spans-displays
    kind: bool
    value: "true"
  - action: command.run
    command: killall 
    args:
      - "SystemUIServer"

