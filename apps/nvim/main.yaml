depends:
  - apps.jq
  - apps.git

actions:
  # macOS
  - action: package.install
    where: os.name == "macos"
    list:
      - neovim
      - tree-sitter-cli
      # standalone formatter, run from the cli
      - yamlfmt

  # Linux
  # latest stable release from GitHub, unpacked to its own directory, so a manual
  # install in /opt/nvim doesn't get in the way. Delete /opt/neovim* to update
  - action: file.download
    where: os.name == "linux"
    from: "https://github.com/neovim/neovim/releases/download/stable/nvim-linux-{{ os.arch | replace(from='aarch64', to='arm64') }}.tar.gz"
    to: /opt/neovim.tar.gz
    privileged: true
  - action: file.unarchive
    where: os.name == "linux"
    from: /opt/neovim.tar.gz
    to: /opt/neovim
    force: false
    privileged: true
  - action: file.link
    where: os.name == "linux"
    source: "/opt/neovim/nvim-linux-{{ os.arch | replace(from='aarch64', to='arm64') }}/bin/nvim"
    target: /usr/local/bin/nvim
    privileged: true

  # nuke defaults
  - action: command.run
    where: os.name == "linux" || os.name == "macos"
    command: sh
    args:
      - "-c"
      - "rm -rf {{ user.home_dir }}/.config/nvim {{ user.home_dir }}/.local/share/nvim {{ user.home_dir }}/.local/state/nvim"
  # init
  - action: file.copy
    from: init.lua
    to: "{{ user.home_dir }}/.config/nvim/init.lua"
  # autocmds
  - action: file.copy
    from: config/autocmds.lua
    to: "{{ user.home_dir }}/.config/nvim/lua/config/autocmds.lua"
  # keymaps
  - action: file.copy
    from: config/keymaps.lua
    to: "{{ user.home_dir }}/.config/nvim/lua/config/keymaps.lua"
  # options
  - action: file.copy
    from: config/options.lua
    to: "{{ user.home_dir }}/.config/nvim/lua/config/options.lua"
  # plugins and their configuration
  - action: file.copy
    from: plugins.lua
    to: "{{ user.home_dir }}/.config/nvim/lua/plugins.lua"
