actions:
  - action: package.install
    list: 
      - esptool
      - espflash
      - cmake
      - ninja
      - dfu-util

  # skipped when the clone exists already, instead of failing like `git clone`
  - action: git.clone
    repo_url: https://github.com/espressif/esp-idf.git
    directory: "{{ user.home_dir }}/esp/esp-idf"

  - action: command.run
    command: git
    dir: "{{ user.home_dir }}/esp/esp-idf"
    args:
      - "submodule"
      - "update"
      - "--init"
      - "--recursive"

  - action: command.run
    command: ./install.sh
    dir: "{{ user.home_dir }}/esp/esp-idf"
    args:
      - "esp32"
