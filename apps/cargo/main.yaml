depends:
  - apps.gnupg
  - apps.rustup
actions:
  # credentials.toml
  - action: file.copy
    from: credentials_encrypted.asc
    to: "{{ user.home_dir }}/.cargo/credentials_encrypted.asc"
  - action: command.run
    command: gpg
    args:
      - "--output"
      - "{{ user.home_dir }}/.cargo/credentials.toml"
      - "--decrypt"
      - "{{ user.home_dir }}/.cargo/credentials_encrypted.asc"
  - action: command.run
    command: rm
    args:
      - "{{ user.home_dir }}/.cargo/credentials_encrypted.asc"
  - action: command.run
    command: cargo
    args:
      - "install"
      - "cargo-watch"
