depends:
  - apps.gnupg
  - apps.rustup
actions:
  # credentials.toml
  - action: file.copy
    from: credentials_encrypted.asc
    to: "{{ user.home_dir }}/.cargo/credentials.toml"
    chmod: 600
    process_with: [gpg, --quiet, --decrypt]
  - action: command.run
    command: cargo
    args:
      - "install"
      - "cargo-watch"
