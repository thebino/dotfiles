actions:
  - action: package.install
    where: os.name == "macos"
    provider: brew
    name: gnupg
  - action: package.install
    where: os.name == "linux"
    provider: apt
    name: gnupg
  # smoke test
  - action: file.copy
    from: encrypted.asc
    to: /tmp/encrypted.asc
  - action: command.run
    command: gpg
    args:
      - "--output"
      - "/tmp/gnupg_smoketest.txt"
      - "--decrypt"
      - "/tmp/encrypted.asc"
  - action: command.run
    command: rm
    args:
      - "-f"
      - "/tmp/encrypted.asc"
      - "/tmp/gnupg_smoketest.txt"
