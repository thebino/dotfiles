# Sioyek is a PDF viewer with a focus on technical books and research papers
actions:
  - action: package.install
    name: sioyek

  - action: file.copy
    from: prefs_user.config
    to: "{{ user.config_dir }}/sioyek/prefs_user.config"
 

  # the cask installs an .app bundle, so the binary is not on PATH -- vimtex
  # looks for a plain "sioyek", and ~/.local/bin is already on PATH
  - action: command.run
    where: os.name == "macos"
    command: sh
    args:
      - "-c"
      - "mkdir -p {{ user.home_dir }}/.local/bin && ln -sf /Applications/sioyek.app/Contents/MacOS/sioyek {{ user.home_dir }}/.local/bin/sioyek"
